<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Álbum Virtual 2026</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Forzamos el comportamiento de pestañas directo para evitar fallos de caché */
        .seccion-pantalla {
            display: none !important;
        }
        .seccion-pantalla.activa {
            display: block !important;
        }
        .menu-panini {
            display: flex;
            justify-content: center;
            background-color: #1a1a2e;
            padding: 15px;
            gap: 12px;
            border-bottom: 3px solid #e94560;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #16213e;
            color: #fff;
            border: 2px solid #0f3460;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .tab-btn:hover {
            background-color: #e94560;
        }
        .tab-btn.activo {
            background-color: #e94560;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>🏆 MI ÁLBUM VIRTUAL 2026</h1>
        <p id="sobres-disponibles">Sobres disponibles hoy: 3</p>
        <button id="btn-reiniciar-dia" style="background-color: #555; font-size: 0.8rem; padding: 5px 10px; margin-top: 5px; color: white; border: none; border-radius: 4px; cursor: pointer;">🔄 Recargar Sobres (Simular mañana)</button>
    </header>

    <!-- MENÚ INTERACTIVO ESTILO PANINI APP -->
    <nav class="menu-panini">
        <button id="btn-tab-sobres" class="tab-btn activo" onclick="cambiarPantalla('pantalla-sobres', 'btn-tab-sobres')">ABRIR SOBRES</button>
        <button id="btn-tab-repetidas" class="tab-btn" onclick="cambiarPantalla('pantalla-repetidas', 'btn-tab-repetidas')">MIS CROMOS</button>
        <button id="btn-tab-album" class="tab-btn" onclick="cambiarPantalla('pantalla-album', 'btn-tab-album')">MI ÁLBUM</button>
    </nav>

    <main>
        <!-- SECCIÓN 1: ABRIR SOBRES (Activa por defecto) -->
        <div id="pantalla-sobres" class="seccion-pantalla activa">
            <div style="text-align: center; margin-bottom: 20px;">
                <button id="btn-abrir-sobre" style="padding: 14px 28px; font-size: 1.1rem; background-color: #e94560; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(233,69,96,0.4);">🛍️ Abrir Sobre Nuevo (5 Cartas)</button>
            </div>
            <h2>📦 Tus cartas del sobre:</h2>
            <div id="contenedor-sobres" class="grid-cartas" style="min-height: 250px; display: flex; align-items: center; justify-content: center;"></div>
        </div>

        <!-- SECCIÓN 2: MIS CROMOS / REPETIDAS (Oculta al cargar) -->
        <div id="pantalla-repetidas" class="seccion-pantalla">
            <div class="seccion-repetidas" style="text-align: center; padding: 30px; background-color: #16213e; border-radius: 10px; border: 1px solid #e94560;">
                <h2>🔄 Zona de Intercambio</h2>
                <p id="contador-repetidas" style="margin: 15px 0; font-size: 1.2rem;">Tienes 0 cartas repetidas</p>
                <button id="btn-intercambiar" style="background-color: #0f3460; color: white; border: none; padding: 12px 24px; border-radius: 25px; cursor: not-allowed; font-weight: bold; transition: background-color 0.2s;" disabled>
                    Canjear 3 Repetidas por 1 Sobre
                </button>
                <div id="contenedor-repetidas" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px;"></div>
            </div>
        </div>

        <!-- SECCIÓN 3: MI ÁLBUM (Oculta al cargar) -->
        <div id="pantalla-album" class="seccion-pantalla">
            <h2>📖 Mi Álbum de Colección</h2>
            <div id="contenedor-album" class="grid-album"></div>
        </div>
    </main>

    <!-- SCRIPT DE NAVEGACIÓN INMEDIATA -->
    <script>
        function cambiarPantalla(idPantalla, idBoton) {
            // Ocultar absolutamente todas las secciones usando el id
            document.getElementById('pantalla-sobres').classList.remove('activa');
            document.getElementById('pantalla-repetidas').classList.remove('activa');
            document.getElementById('pantalla-album').classList.remove('activa');

            // Quitar el estado activo a todos los botones
            document.getElementById('btn-tab-sobres').classList.remove('activo');
            document.getElementById('btn-tab-repetidas').classList.remove('activo');
            document.getElementById('btn-tab-album').classList.remove('activo');

            // Activar solo la pantalla seleccionada y su botón
            document.getElementById(idPantalla).classList.add('activa');
            document.getElementById(idBoton).classList.add('activo');
        }
    </script>
    
    <script src="script.js"></script>
</body>
</html>
